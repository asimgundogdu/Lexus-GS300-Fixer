kind = "web"
previewPath = "/"
title = "Lexus GS300 Arıza Teşhis"
version = "1.0.0"
id = "artifacts/lexus-gs300"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21628

[services.development]
run = "pnpm --filter @workspace/lexus-gs300 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lexus-gs300", "run", "build" ]
serve = "static"
publicDir = "artifacts/lexus-gs300/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21628"
BASE_PATH = "/"
